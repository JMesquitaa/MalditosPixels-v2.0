; ═══════════════════════════════════════════════════════════════
;  MALDITOS PIXELS Core — PPFilter MRACHADORES (Fase 12.25)
;
;  Base: INI MALDITOS PIXELS calibrado pro Lua MALDITOS PIXELS (TONEMAPPING/AUTO_EXPOSURE/COLOR/etc)
;  Bloom: [GLARE] da referencia (ganho real da 12.24, nao depende do Lua)
;  [GODRAYS] da referencia (nao depende do Lua)
;
;  Secoes REVERTIDAS (brigam com Lua MALDITOS PIXELS se forem da referencia):
;    [TONEMAPPING] — GAMMA=2.2/HDR=0 funciona com o Lua MALDITOS PIXELS; ref GAMMA=1.01/HDR=1
;                    foi desenhado pro Lua da ref (protegido, nao temos)
;    [AUTO_EXPOSURE] — DELAY=0.3/MAX=1.5/MIN=0.05 calibrado pro CBE do MALDITOS PIXELS
;    [EXT_AUTO_EXPOSURE] — area 0.8x0.55 calibrada pro MALDITOS PIXELS
;    [EXT_DXGI_HDR] — SUPPORTED=1 pro MALDITOS PIXELS
;    [COLOR] — COLOR_TEMP=6450 calibrado pro MALDITOS PIXELS (Lua modula por multiplicador)
;    [VIGNETTING] — STRENGTH=0.08 (look MALDITOS PIXELS; ref usa 0.001)
;    [DOF] — QUALITY=3/F_NUMBER=12 (otimizado MALDITOS PIXELS)
;
;  Secoes MANTIDAS da referencia:
;    [GLARE] — bloom/glare/star/ghost INTEIRO (nao depende do Lua)
;    [GODRAYS] — godrays da referencia (nao depende do Lua)
;    [EXT_HDR] — FILMIC_CONTRAST=1 (paridade)
;    [EXT_GLARE] — anamorphic color (paridade)
;    [EXT_GLARE_FIRSTPERSON_SHAPE] — ref values
; ═══════════════════════════════════════════════════════════════

