; ═══════════════════════════════════════════════════════════════
;  MALDITOS PIXELS — PP Filter da comunidade MRACHADORES
;  Versao: 1.0
;  Identidade visual: MALDITOS PIXELS by MRACHADORES
;  Base escura cinematografica, glare anamorfico, contraste frio-quente
;
;  Requisitos: Pure >= 2.57, CSP >= 0.2.9
;  Pipeline: Pure (nao LCS)
;  Tonemapping real: Uchimura (injetado via Lua, substitui FUNCTION=2 em runtime)
;
;  Este INI define os parametros ESTATICOS do pipeline YEBIS.
;  O script Lua (pure_scripts/MALDITOS PIXELS Core Vivid.lua) controla:
;    - Tonemapping Uchimura com parametros ajustaveis
;    - Exposicao adaptativa (CBE + AE)
;    - Cor cinematografica (sombra fria / luz quente)
;    - Godrays dinamicos
;    - Ajustes por hora do dia
; ═══════════════════════════════════════════════════════════════

[ABOUT]
AUTHOR=MRACHADORES
CSP_EDITOR=3859
NOTES=MALDITOS PIXELS Core Vivid — cinematografico, realista, vibrante
URL=
VERSION=1.2


; ─────────────────────────────────────────────────────
;  YEBIS ENGINE
;  Deve estar ativo para que qualquer PP filter funcione
; ─────────────────────────────────────────────────────
[YEBIS]
ENABLED=1


; ─────────────────────────────────────────────────────
;  TONEMAPPING (base YEBIS)
;  FUNCTION=2 (Reinhard mod.) e a base que o YEBIS usa internamente.
;  O script Lua SUBSTITUI isso por Uchimura via pure.pp.setTonemapping()
;  em runtime — ou seja, estes valores so servem de fallback se o Lua
;  nao carregar.
;
;  EXPOSURE=0.35 — meio-termo: referencia usa 0.4, referencia usa 0.30
;  GAMMA=2.2 — sRGB correto, nao depende do Lua para gamma
;  HDR=0 — desativado no YEBIS, exposicao controlada pelo Lua/CBE
;  MAPPING_FACTOR=1.15 — leve boost nos midtones
; ─────────────────────────────────────────────────────
[TONEMAPPING]
EXPOSURE=0.30
FUNCTION=2
GAMMA=2.200000
HDR=0
MAPPING_FACTOR=1.125000
OFFSET_X=0
OFFSET_Y=0
SCALE_HEIGHT=1
SCALE_WIDTH=1


; ─────────────────────────────────────────────────────
;  AUTO EXPOSURE (YEBIS built-in)
;  TARGET=0.30 — levemente escuro (cinematografico) mas jogavel de dia
;  INFLUENCED_BY_GLARE=0 — evita pumping (oscilacao) com fontes de luz
;  DELAY=0.3 — transicao suave, nao instantanea (cinematografico)
;  MAX=1.5 — permite ate 1.5x de exposure (noite nao fica preta)
;  MIN=0.05 — NUNCA 0! Evita tela completamente preta em cenas claras
; ─────────────────────────────────────────────────────
[AUTO_EXPOSURE]
DELAY=0.5
ENABLED=1
INFLUENCED_BY_GLARE=1
MAX=2
METERING_HEIGHT=100
METERING_OFFSET_X=0
METERING_OFFSET_Y=0
METERING_WIDTH=100
MIN=0
SET_Y=0
TARGET=0.26


; ─────────────────────────────────────────────────────
;  AREA DE METERING (extensao CSP)
;  Derivada do referencia — area 80%x55% deslocada pra cima
;  Ignora o painel do carro, prioriza horizonte/estrada
;  Resultado: exposure nao e puxada pra baixo pelo interior escuro
; ─────────────────────────────────────────────────────
[EXT_AUTO_EXPOSURE]
METERING_AREA_DEBUG=0
METERING_AREA_OFFSET=0.000000,-0.070000
METERING_AREA_SIZE=0.900000,0.520000


; ─────────────────────────────────────────────────────
;  ADAPTACAO DE EXPOSICAO EXTENDIDA (CSP)
;  ENABLED=0 — desativado. O script Lua controla via CBE/handleExposure.
;  Valores calibrados aqui como referencia caso seja ativado no futuro.
;  DARK_ADAPTATION_SPEED > ADAPTATION_SPEED = olho se adapta mais
;  rapido ao escuro (fisiologicamente correto, bom pra tuneis)
; ─────────────────────────────────────────────────────
[EXT_AE_ADJUSTMENT]
ADAPTATION_SCALE=0.650000
ADAPTATION_SENSITIVITY=0.500000
ADAPTATION_SPEED_LIMIT=4.880000
DARK_ADAPTATION_SCALE=0.800000
DARK_ADAPTATION_SENSITIVITY=0.500000
DARK_ADAPTATION_SPEED_LIMIT=6.180000
ENABLED=0
LIGHT_DARK_EXPOSURE_BORDER=0.050000


; ─────────────────────────────────────────────────────
;  COR (YEBIS base)
;  TUDO NEUTRO. O color grading real e feito pelo Lua via pure.pp.set()
;  e pela LUT em [EXT_COLOR_GRADING]. Nao queimamos ajustes de cor
;  no pipeline fixo — isso permite ao Lua ajustar dinamicamente.
;
;  COLOR_TEMP=6450 — levemente frio (daylight=6500K)
; ─────────────────────────────────────────────────────
[COLOR]
BRIGHTNESS=1
COLOR_TEMP=6400
CONTRAST=1
HUE=0
SATURATION=1
SEPIA=0
WHITE_BALANCE=6400


; ─────────────────────────────────────────────────────
;  COLOR GRADING (LUT externa)
;  Caminho RELATIVO — funciona em qualquer PC!
;  (referencia usava path absoluto H:\ que quebrava em outros PCs)
;  STRENGTH=0.75 — aplica a 75%, deixando margem pro Lua ajustar
; ─────────────────────────────────────────────────────
[EXT_COLOR_GRADING]
ENABLED=1
FILE=extension/textures/color_grading/mpixels_vivo.png
STRENGTH=1


; ─────────────────────────────────────────────────────
;  CONTRASTE FILMICO (extensao CSP)
;  Adiciona curva S cinematografica no contraste.
;  0.45 — medio. referencia usa 1.0 (extremo), referencia usa 0.35 (sutil)
; ─────────────────────────────────────────────────────
[EXT_HDR]
FILMIC_CONTRAST=0.350000


; ─────────────────────────────────────────────────────
;  HDR DXGI (para monitores HDR)
;  SUPPORTED=1 — ativa suporte HDR
;  POST_GAMMA=0.70 — escurece em HDR (compensa brilho extra do monitor)
;  CUSTOM_YEBIS_TONEMAPPING=1 — usa tonemap custom em modo HDR
;  Valores mais conservadores que referencia (que usava POST_GAMMA=0.65)
; ─────────────────────────────────────────────────────
[EXT_DXGI_HDR]
CUSTOM_YEBIS_EXPOSURE=0.24
CUSTOM_YEBIS_FILMIC_CONTRAST=0
CUSTOM_YEBIS_FUNCTION=2
CUSTOM_YEBIS_GAMMA=1.2
CUSTOM_YEBIS_MAPPING_FACTOR=1.2
CUSTOM_YEBIS_TONEMAPPING=1
POST_BRIGHTNESS=1
POST_GAMMA=0.65
POST_TONEMAPPING=1
SUPPORTED=1
YEBIS_BRIGHTNESS=0.3


; ─────────────────────────────────────────────────────
;  GLARE / BLOOM
;  Filosofia: bloom suave em tudo (BLOOM_FILTER_THRESHOLD baixo)
;  + star glare SELETIVO so em fontes brilhantes (THRESHOLD=30 alto)
;  = imagem com "glow" cinematografico sem estrelas em todo lugar
;
;  ANAMORPHIC=1 — streak horizontal (look de lente anamorfica)
;  SHAPE_STAR_STREAKS_NUMBER=6 — 6 pontas (como referencia)
;  SHAPE_BLOOM_DISPERSION=0.5 — dispersao cromatica visivel do referencia
;  LUMINANCE=2.8 — menos agressivo que referencia (3.8) pra nao lavar
;  QUALITY=4 — bom custo/beneficio (referencia/referencia usam 5, caro)
; ─────────────────────────────────────────────────────
[GLARE]
AFTER_IMAGE=1
ANAMORPHIC=1
BLOOM_FILTER_THRESHOLD=0.001000
BLOOM_GAUSSIAN_RADIUS_SCALE=1.05
BLOOM_LUMINANCE_GAMMA=2.1
BLOOM_NUM_LEVELS=0
BLUR=2.5
BRIGHT_PASS=1
ENABLED=1
GENERATION_RANGE_SCALE=0.07
GHOST=1
GHOST_CONCENTRIC_DISTORTION=1
LUMINANCE=3.8
PRECISION=0
QUALITY=5
SHAPE=11
SHAPE_AFTERIMAGE_LENGTH=0
SHAPE_AFTERIMAGE_LUMINANCE=0
SHAPE_BLOOM_DISPERSION=0.03
SHAPE_BLOOM_DISPERSION_BASE_LEVEL=2
SHAPE_BLOOM_LUMINANCE=1.940000
SHAPE_GHOST_DISTORTION=0
SHAPE_GHOST_HALO_LUMINANCE=0.005
SHAPE_GHOST_LUMINANCE=0.38
SHAPE_GHOST_SHARPENESS=0
SHAPE_LUMINANCE=1.000000
SHAPE_STAR_DISPERSION=0.100000
SHAPE_STAR_FORCE_DISPERSION=0
SHAPE_STAR_INCLINATION_ANGLE=3
SHAPE_STAR_LENGTH=0.120000
SHAPE_STAR_LUMINANCE=0.320000
SHAPE_STAR_ROTATION=1
SHAPE_STAR_SECONDARY_LENGTH=0.210000
SHAPE_STAR_STREAKS_NUMBER=6
STAR_FILTER_THRESHOLD=0.000500
STAR_LENGTH_FOV_DEPENDENCE=0.000000
STAR_SOFTNESS=0.800000
THRESHOLD=40
USE_CUSTOM_SHAPE=1

[EXT_GLARE]
ANAMORPHIC_COLOR_0=1.000000,0.995000,0.990000,1.000000
ANAMORPHIC_PARAM_0=0.980000

; ─────────────────────────────────────────────────────
;  GLARE PRIMEIRA PESSOA (cockpit)
;  Desativado — o glare principal ja cobre essa situacao
;  Ativar causaria bloom duplo em visao interna
; ─────────────────────────────────────────────────────
[EXT_GLARE_FIRSTPERSON_SHAPE]
ENABLED=0
SHAPE_AFTERIMAGE_LENGTH=0
SHAPE_AFTERIMAGE_LUMINANCE=0
SHAPE_BLOOM_DISPERSION=0
SHAPE_BLOOM_DISPERSION_BASE_LEVEL=0
SHAPE_BLOOM_LUMINANCE=1.200000
SHAPE_GHOST_DISTORTION=0.500000
SHAPE_GHOST_HALO_LUMINANCE=0
SHAPE_GHOST_LUMINANCE=2.000000
SHAPE_GHOST_SHARPENESS=0
SHAPE_LUMINANCE=0.200000
SHAPE_STAR_DISPERSION=0
SHAPE_STAR_FORCE_DISPERSION=0
SHAPE_STAR_INCLINATION_ANGLE=3.500000
SHAPE_STAR_LENGTH=0.100000
SHAPE_STAR_LUMINANCE=0.400000
SHAPE_STAR_ROTATION=1
SHAPE_STAR_SECONDARY_LENGTH=0
SHAPE_STAR_STREAKS_NUMBER=4


; ─────────────────────────────────────────────────────
;  GODRAYS
;  LENGTH=10 — raios longos e dramaticos
;  ANGLE_ATTENUATION=7 — godrays somem fora do eixo solar (realista)
;    referencia usa 1 (sempre visivel), referencia usa 9 (some rapido)
;    7 = meio-termo — visivel numa faixa ampla mas nao em todo lugar
;  NOISE_MASK=0.15 — leve ruido nos raios (mais natural que 0)
;  GLARE_RATIO=0.05 — godrays contribuem sutilmente pro glare
;  Heat particles ativas — shimmer de calor no asfalto
; ─────────────────────────────────────────────────────
[GODRAYS]
ANGLE_ATTENUATION=9.000000
COLOR=1,1,1,1
DEPTH_MASK_THRESHOLD=0.99999
DIFFRACTION_RING=0.1
DIFFRACTION_RING_ATTENUATION=0.1
DIFFRACTION_RING_OUTER_COLOR=0.5,0.5,0.5,0.5
DIFFRACTION_RING_RADIUS=5.600000
DIFFRACTION_RING_SPECTRUM_ORDER=1
ENABLED=1
GLARE_RATIO=0.000000
HEAT_PARTICLE_COLOR=1,1,1
HEAT_PARTICLE_COORD=1.5
HEAT_PARTICLE_FRACTAL_OCTAVES=3
HEAT_PARTICLE_INTENSITY_MULT=100
HEAT_PARTICLE_LIFE_MULT=1.0
HEAT_PARTICLE_MAX_NUMBER=10
HEAT_PARTICLE_MIN_INTENSITY=0.15
HEAT_PARTICLE_MIN_LIFE=1
HEAT_PARTICLE_MIN_VELOCITY=0
HEAT_PARTICLE_POSITION_VELOCITY=0,0,0.2
HEAT_PARTICLE_RADIUS=0.75
HEAT_PARTICLE_RADIUS_VELOCITY_MULT=0.1
HEAT_PARTICLE_SHIMMER=0.004
HEAT_PARTICLE_VELOCITY_MULT=0.1
LENGTH=11.0
NOISE_FREQUENCY=1
NOISE_MASK=0.000000
USE_SUN_LIGHT=1


; ─────────────────────────────────────────────────────
;  DOF (Profundidade de Campo)
;  F_NUMBER=12 — abertura fechada (DOF minimo, quase tudo em foco)
;  QUALITY=3 — otimizado! referencia/referencia usam 5-6 (caro demais)
;    Com f/12 o DOF e quase imperceptivel, entao quality alta e desperdicio
;  APERTURE_SHAPE=4 — 4 laminas (bokeh quadrado sutil)
;  IMAGE_SENSOR_HEIGHT=0.22 — sensor Super 35mm (cinematografico)
; ─────────────────────────────────────────────────────
[DOF]
ADAPTIVE_APERTURE_FACTOR=0.5
APERTURE_BACK_LEVELS_NUMBER=-1
APERTURE_FRONT_LEVELS_NUMBER=-1
APERTURE_F_NUMBER=12
APERTURE_PARAMETER=2
APERTURE_SHAPE=3
BACKGROUND_MASK_THRESHOLD=0.1
BASE_FOV=50
EDGE_QUALITY=4
ENABLED=1
IMAGE_SENSOR_HEIGHT=0.24
QUALITY=5

[DIAPHRAGM]
ROTATE_OFFSET=2
ROTATE_SCALE=0
TYPE=1


; ─────────────────────────────────────────────────────
;  VIGNETTE
;  STRENGTH=0.08 — sutil mas perceptivel (contribui pro look cinema)
;    referencia usa ~0 (nenhum), referencia usa 0.01 (quase zero)
;    0.08 adiciona escurecimento nas bordas sem ser opressivo
;  FOV_DEPENDENCE=0.5 — vignette aumenta com FOV amplo (realista)
; ─────────────────────────────────────────────────────
[VIGNETTING]
FOV_DEPENDENCE=0.542
STRENGTH=0.01


; ─────────────────────────────────────────────────────
;  DISTORCAO DE LENTE
;  ENABLED=1 — ativo (como referencia, referencia desativa)
;  ROUNDNESS=0.04 — muito sutil, quase imperceptivel
;  Adiciona "lens feel" sem distorcer a gameplay
; ─────────────────────────────────────────────────────
[LENSDISTORTION]
ENABLED=0
ROUNDNESS=0.05
SMOOTHNESS=1.0


; ─────────────────────────────────────────────────────
;  ABERRACAO CROMATICA
;  Desativada no INI — sera implementada via shader HLSL na Etapa 2
;  Valores preparados pra quando for ativada
; ─────────────────────────────────────────────────────
[CHROMATIC_ABERRATION]
ENABLED=0
LATERAL_DISPERSION=0.017000,0.000000
SAMPLES=7
UNIFORM_DISPERSION=0.000000,0.002700


; ─────────────────────────────────────────────────────
;  AIRY DISC
;  Desativado — efeito de difracao em aberturas muito pequenas
;  Custo alto, beneficio duvidoso com f/12
; ─────────────────────────────────────────────────────
[AIRYDISC]
AIRY_DISC_DISPERSION_ENABLED=1
ENABLED=0
WAVELENGTH=500


; ─────────────────────────────────────────────────────
;  ANTI-ALIASING (YEBIS interno)
;  Suavizacao adicional do YEBIS, separada do FXAA/SMAA do CSP
; ─────────────────────────────────────────────────────
[ANTIALIAS]
ENABLED=1
END_DISTANCE=1000
START_DISTANCE=0.1


; ─────────────────────────────────────────────────────
;  FEEDBACK (ghosting temporal)
;  Desativado — cria trail de movimento, nao desejado pra racing
; ─────────────────────────────────────────────────────
[FEEDBACK]
ASPECT_RATIO=0
CURRENT_WEIGHT=-0.05
ENABLED=0
TIME=0.1
WEIGHT=0.05


; ─────────────────────────────────────────────────────
;  OTIMIZACOES
;  FIXED_WIDTH=0 — renderiza na resolucao nativa (sem downscale interno)
; ─────────────────────────────────────────────────────
[OPTIMIZATIONS]
FIXED_WIDTH=0

[VARIOUS]
APERTURE_RESULT_BLUR_MOD=1
